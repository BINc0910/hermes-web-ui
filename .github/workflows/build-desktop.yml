name: Build Desktop Installer

on:
  push:
    branches: [v1.1.0-basic]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/client/package-lock.json

      - name: Install & Build
        working-directory: packages/client
        run: |
          npm ci 2>$null || npm install
          npx vite build

      - name: Package Desktop
        working-directory: packages/desktop
        run: |
          npm install
          npx tsc -p tsconfig.json
          npx electron-builder --win -c.extraMetadata.main=dist/main/index.js --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: LLink-Agent-基础版-v1.1.0
          path: packages/desktop/release/*.exe
