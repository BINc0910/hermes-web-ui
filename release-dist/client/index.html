  <!-- Prevent FOUC by applying theme classes immediately -->
  <script>
    (function() {
      try {
        const brightness = localStorage.getItem('hermes_brightness') || 'system';
        const style = localStorage.getItem('hermes_style') || 'ink';

        // Resolve dark mode
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = brightness === 'dark' || (brightness === 'system' && prefersDark);

        // Resolve comic style
        const isComic = style === 'comic';

        // Apply classes immediately
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        if (isComic) {
          document.documentElement.classList.add('comic');
        }
      } catch (e) {
        console.warn('Failed to apply theme:', e);
      }
    })();
  </script>

  <!-- 隐藏：工具栏 → 编程工具 -->
  <script>
    setTimeout(function(){
      var items = document.querySelectorAll('.nav-item');
      for (var i = 0; i < items.length; i++) {
        var t = (items[i].textContent || '').trim();
        if (t === '编程工具' || t === 'codingAgents') {
          items[i].remove();
          continue;
        }
        // 隐藏：对话栏 → 中转站
        if (t === '中转站') {
          items[i].remove();
          continue;
        }
        // 隐藏：对话栏 → 群聊
        if (t.indexOf('群聊') >= 0 || t.indexOf('groupChat') >= 0) {
          items[i].remove();
          continue;
        }
      }
      // 隐藏底部栏：版本号、GitHub、Website
      var els = document.querySelectorAll('.version-text, .github-link, .website-link');
      for (var j = 0; j < els.length; j++) {
        els[j].style.display = 'none';
      }
      // 强制修改浏览器标签页标题
      document.title = 'LLink Agent';

      // 自动登录：跳过登录页面
      autoLogin();
    }, 800);

    function autoLogin() {
      // 如果已有 token，跳过自动登录，避免无限刷新循环
      if (localStorage.getItem('hermes_token')) return;
      // 调用登录API（服务端已绕过密码验证）
      setTimeout(function() {
        fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: 'admin', password: 'admin'})
        }).then(function(r) {
          if (r.ok) return r.json().then(function(d) {
            if (d.token) localStorage.setItem('hermes_token', d.token);
            location.reload();
          });
        }).catch(function(){});
      }, 2000);
    }
  </script>
